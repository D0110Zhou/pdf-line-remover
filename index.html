<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF 分割線去除工具 V3 (Web)</title>
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/layout.css" />
<link rel="stylesheet" href="./css/components.css" />
<script type="importmap">
{
  "imports": {
    "pdfjs-dist": "./vendor/pdfjs/pdf.min.mjs",
    "pdf-lib": "./vendor/pdf-lib/pdf-lib.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="toolbar" class="toolbar">
    <div class="toolbar__group">
      <button id="btn-open" class="btn btn--primary">開啟 PDF</button>
      <input id="file-input" type="file" accept="application/pdf" hidden />
    </div>
    <div class="toolbar__group">
      <label for="input-pages" class="toolbar__label">指定頁碼</label>
      <input id="input-pages" class="input" type="text" placeholder="例: 1,3-5" autocomplete="off" />
      <button id="btn-apply-pages" class="btn">套用頁碼</button>
    </div>
    <div class="toolbar__group">
      <button id="btn-mode-select" class="btn btn--toggle is-active">框選模式</button>
      <button id="btn-mode-pan" class="btn btn--toggle">平移模式</button>
    </div>
    <div class="toolbar__group">
      <button id="btn-prev" class="btn">上一頁</button>
      <span id="page-info" class="page-info">第 0 / 0 頁</span>
      <button id="btn-next" class="btn">下一頁</button>
    </div>
    <div class="toolbar__group">
      <button id="btn-delete" class="btn" title="把選取的紅線移出擦除清單">刪除選取線條</button>
      <button id="btn-cells" class="btn">儲存格文字</button>
      <button id="btn-export" class="btn btn--accent">一鍵擦除並輸出 PDF</button>
    </div>
  </header>
  <main id="workspace" class="workspace">
    <div id="viewport" class="viewport">
      <div id="page-stack" class="page-stack">
        <canvas id="pdf-canvas" class="page-canvas"></canvas>
        <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
      </div>
    </div>
  </main>
  <footer id="status-bar" class="status-bar">
    <span id="status-text" class="status-text">就緒 — 請先開啟一份 PDF</span>
    <span id="zoom-text" class="zoom-text">100%</span>
  </footer>
</div>
<div id="floating-root"></div>
<div id="toast-root" class="toast-root"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
